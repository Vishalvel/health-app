<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit a phone screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Health Calculator</title>

  <style>
    /* ---------- STYLE: how the page looks ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f7f4;
      color: #1f2d27;
      padding: 16px;
    }

    .container {
      max-width: 480px;      /* keeps the app narrow like a phone */
      margin: 0 auto;
    }

    h1 { font-size: 1.5rem; margin: 8px 0 4px; }
    .subtitle { margin: 0 0 20px; color: #55685f; }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
    }

    label { display: block; margin: 12px 0 4px; font-weight: bold; font-size: 0.9rem; }

    input, select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #c5d3cb;
      border-radius: 10px;
      background: #fff;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
      background: #2e8b57;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:active { background: #256f46; }

    .error { color: #b3261e; margin-top: 12px; font-size: 0.9rem; }

    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e4ece7;
    }
    .result-row:last-child { border-bottom: none; }
    .result-row strong { font-size: 1.05rem; }

    .note { font-size: 0.8rem; color: #6b7d74; margin-top: 12px; }

    .hidden { display: none; }
  </style>
</head>

<body>
  <div class="container">
    <h1>Daily Health Calculator</h1>
    <p class="subtitle">Find your daily water, calories and macros.</p>

    <!-- ---------- FORM: where the user types their details ---------- -->
    <div class="card">
      <label for="age">Age (years)</label>
      <input id="age" type="number" placeholder="e.g. 25" min="10" max="100">

      <label for="gender">Gender</label>
      <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <label for="height">Height (cm)</label>
      <input id="height" type="number" placeholder="e.g. 170">

      <label for="weight">Weight (kg)</label>
      <input id="weight" type="number" placeholder="e.g. 65">

      <label for="activity">Activity level</label>
      <select id="activity">
        <option value="1.2">Little or no exercise</option>
        <option value="1.375">Light exercise (1-3 days/week)</option>
        <option value="1.55" selected>Moderate exercise (3-5 days/week)</option>
        <option value="1.725">Hard exercise (6-7 days/week)</option>
        <option value="1.9">Very hard exercise or physical job</option>
      </select>

      <label for="goal">Your goal</label>
      <select id="goal">
        <option value="lose">Lose weight</option>
        <option value="maintain" selected>Maintain weight</option>
        <option value="gain">Gain weight</option>
      </select>

      <button id="calcBtn">Calculate</button>
      <div id="error" class="error"></div>
    </div>

    <!-- ---------- RESULTS: hidden until the user presses Calculate ---------- -->
    <div id="results" class="card hidden">
      <div class="result-row"><span>Water per day</span><strong id="waterOut"></strong></div>
      <div class="result-row"><span>Calories per day</span><strong id="calOut"></strong></div>
      <div class="result-row"><span>Protein</span><strong id="proteinOut"></strong></div>
      <div class="result-row"><span>Carbs</span><strong id="carbsOut"></strong></div>
      <div class="result-row"><span>Fat</span><strong id="fatOut"></strong></div>
      <p class="note">
        These are general estimates, not medical advice. If you have a health
        condition, please check with a doctor or dietitian.
      </p>
    </div>
  </div>

  <script>
    /* ---------- LOGIC: the calculations ---------- */

    // Connect the button to the calculate function
    document.getElementById("calcBtn").addEventListener("click", calculate);

    function calculate() {
      // 1. Read what the user typed
      const age      = Number(document.getElementById("age").value);
      const gender   = document.getElementById("gender").value;
      const height   = Number(document.getElementById("height").value);
      const weight   = Number(document.getElementById("weight").value);
      const activity = Number(document.getElementById("activity").value);
      const goal     = document.getElementById("goal").value;

      const errorBox = document.getElementById("error");
      const results  = document.getElementById("results");

      // 2. Check the input is valid
      if (!age || !height || !weight || age < 10 || height < 100 || weight < 25) {
        errorBox.textContent = "Please enter a valid age, height and weight.";
        results.classList.add("hidden");
        return;
      }
      errorBox.textContent = "";

      // 3. WATER: about 35 ml for every kg of body weight
      const waterLitres = (weight * 35) / 1000;

      // 4. BMR: calories your body burns at rest (Mifflin-St Jeor formula)
      let bmr = 10 * weight + 6.25 * height - 5 * age;
      bmr = gender === "male" ? bmr + 5 : bmr - 161;

      // 5. Maintenance calories = BMR x activity level
      const maintenance = bmr * activity;

      // 6. Adjust calories for the goal
      let calories = maintenance;
      if (goal === "lose") calories = maintenance - 500;
      if (goal === "gain") calories = maintenance + 400;

      // Safety floor: do not recommend dangerously low calories
      const minimum = gender === "male" ? 1500 : 1200;
      if (calories < minimum) calories = minimum;

      // 7. MACROS: 20% protein, 50% carbs, 30% fat
      // 1 g protein = 4 kcal, 1 g carbs = 4 kcal, 1 g fat = 9 kcal
      const proteinG = (calories * 0.20) / 4;
      const carbsG   = (calories * 0.50) / 4;
      const fatG     = (calories * 0.30) / 9;

      // 8. Show the results on the page
      document.getElementById("waterOut").textContent   = waterLitres.toFixed(1) + " L";
      document.getElementById("calOut").textContent     = Math.round(calories) + " kcal";
      document.getElementById("proteinOut").textContent = Math.round(proteinG) + " g";
      document.getElementById("carbsOut").textContent   = Math.round(carbsG) + " g";
      document.getElementById("fatOut").textContent     = Math.round(fatG) + " g";

      results.classList.remove("hidden");
    }
  </script>
</body>
</html>
